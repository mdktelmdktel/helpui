[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpui"
version = "0.1.0"
description = "Generate a local WebUI for any non-interactive CLI tool, just from its --help output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    # Parser targets: click and typer are the CLIs we parse --help from.
    "click>=8.1",
    "typer>=0.12",
]

[project.scripts]
helpui = "helpui.cli:main"

[tool.setuptools]
packages = ["helpui", "helpui.parsers", "helpui.runtime"]

[tool.setuptools.package-data]
helpui = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:helpui.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# `scripts/` holds one-off verification probes written while chasing a specific
# bug: they read a generated project, print conclusion lines, and exit. They are
# evidence for a fix (see SPEC.md), not shipped code, so they are excluded from
# the product lint gate. `helpui/` and `tests/` are linted strictly.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["helpui"]
strict = true
warn_unused_ignores = true
