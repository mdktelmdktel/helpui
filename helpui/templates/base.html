<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ spec.tool_name }}{% endblock %} · HelpUI</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">▚</span>
      <span class="brand-text">HelpUI</span>
    </a>
    <nav class="topnav">
      <a href="/">Commands</a>
      <a href="/history">History</a>
    </nav>
    <div class="tool-badge" title="{{ spec.tool_path }}">
      <span class="dot"></span>
      <code>{{ spec.tool_name }}</code>
      <span class="kind">{{ spec.parser_kind }}</span>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Generated by HelpUI from <code>{{ spec.tool_path }}</code>
  </footer>
</body>
</html>
